services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ayra
      POSTGRES_PASSWORD: ayra-local-only
      POSTGRES_DB: ayra
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayra -d ayra"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://ayra:ayra-local-only@postgres:5432/ayra?schema=public
      DIRECT_URL: postgresql://ayra:ayra-local-only@postgres:5432/ayra?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:-http://localhost:5000}
      BETTER_AUTH_APP_NAME: ${BETTER_AUTH_APP_NAME:-Ayra}
      RESEND_FROM: ${RESEND_FROM:-no-reply@example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        BACKEND_ORIGIN: http://server:5000
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Ayra}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_LOGO: ${NEXT_PUBLIC_LOGO:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@example.com}
    environment:
      BACKEND_ORIGIN: http://server:5000
      PORT: 3000
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
